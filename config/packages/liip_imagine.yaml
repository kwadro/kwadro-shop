# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "imagick"
    loaders:
        default:
            filesystem:
                data_root:
                    - '/home/kwadro/kvadro.if.ua/www/shared/public'
                    - '%kernel.project_dir%/public'


    filter_sets:
        product_thumbnail:
            quality: 85
            filters:
                thumbnail:
                    size: [348, 348]
                    mode: inset
        home_hero:
            quality: 85
            filters:
                thumbnail:
                    size: [ 378, 284 ]
                    mode: inset
        home_logo:
            quality: 85
            filters:
                thumbnail:
                    size: [ 180, 60 ]
                    mode: inset
