# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "imagick"
    loaders:
        default:
            filesystem:
                # Deployer shares public/uploads + public/images outside the release.
                # realpath() then leaves %kernel.project_dir%/public, so Liip rejects
                # those files unless the shared root is also allow-listed.
                data_root:
                    - '%kernel.project_dir%/public'
#                    - '%kernel.project_dir%/../../shared/public'
    filter_sets:
        product_thumbnail:
            quality: 100
            filters:
                thumbnail:
                    size: [348, 348]
                    mode: inset
        home_hero:
            quality: 100
            filters:
                thumbnail:
                    size: [378, 284]
                    mode: inset
        home_logo:
            quality: 100
            filters:
                thumbnail:
                    size: [180, 60]
                    mode: inset
        cat_thumbnail:
            quality: 100
            filters:
                thumbnail:
                    size: [375, 197]
                    mode: outbound
