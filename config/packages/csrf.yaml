# EasyAdmin and other Symfony forms use session-based CSRF tokens.
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        # Storefront tokens are stateless so cached pages (nginx FPC) do not start a session.
        stateless_token_ids:
            - authenticate
            - logout
            - cart_add
            - cart_remove
            - city_update
