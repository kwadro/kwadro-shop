# nginx full page cache (fastcgi_cache) for the Kvadro storefront.
#
# Only for servers where you control nginx. On Apache / shared hosting nothing from this file is needed:
# the default FPC_MODE=symfony caches pages in PHP (App\Http\AppHttpCache, var/cache/prod/http_cache).
# To use this nginx config instead, set FPC_MODE=nginx and FPC_CACHE_DIR in .env.local.
#
# How it works:
#   - Symfony decides what is cacheable and sends "X-Accel-Expires: <ttl>" (App\EventSubscriber\FullPageCacheSubscriber).
#     Everything else gets "X-Accel-Expires: 0". nginx strips this header before sending to the browser.
#   - Visitors with a session (logged in, admin, checkout) or a non-empty cart (cookie kv_cart) bypass the cache.
#   - The city cookie is part of the key because the header shows the visitor's delivery city.
#   - Content changes (admin save, imports, deploy) delete the cache directory: bin/console app:fpc:purge.
#
# App env (.env.local on the server):
#   FPC_MODE=nginx
#   FPC_ENABLED=1
#   FPC_TTL=300
#   FPC_CACHE_DIR=/var/cache/nginx/kvadro
# PHP-FPM must be able to delete files there: run nginx workers and the PHP-FPM pool as the same user,
# or put both in one group and use the "user" directive / umask accordingly.

# ---------------------------------------------------------------------------
# 1) http { ... } context (e.g. /etc/nginx/conf.d/kvadro-fpc.conf)
# ---------------------------------------------------------------------------
fastcgi_cache_path /var/cache/nginx/kvadro levels=1:2 keys_zone=kvadro_fpc:64m max_size=2g inactive=2h use_temp_path=off;

map $http_cookie $kvadro_fpc_bypass {
    default                 0;
    "~*(^|;\s*)PHPSESSID="  1;
    "~*(^|;\s*)kv_cart="    1;
}

# ---------------------------------------------------------------------------
# 2) server { ... } context — inside the PHP location that passes to PHP-FPM
# ---------------------------------------------------------------------------
