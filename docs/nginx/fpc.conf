#
# Notes:
#   - Responses with Set-Cookie are never cached by nginx (default behaviour) — keep it that way.
#   - Cached hits do not reach Symfony: BlockedIp, request logging (RequestList) and redirects
#     only run on cache misses. Block abusive IPs in nginx (deny) as well.
#   - Check: curl -sI https://example.com/uk | grep -i x-cache-status   (MISS, then HIT)
