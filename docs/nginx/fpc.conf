#     fastcgi_cache_methods    GET HEAD;
#     fastcgi_cache_bypass     $kvadro_fpc_bypass;
#     fastcgi_no_cache         $kvadro_fpc_bypass;
#     fastcgi_cache_valid      200 5m;
